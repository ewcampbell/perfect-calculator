<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <style>
            .calc-display {
                display: block;
                text-align: right;
                width: 250px;
                height: 40px;
                font-size: large;
            }
            .calc-button {
                display: block;
                text-align: center;
                width: 50px;
                height: 40px;
            }
        </style>
    </head>
    <body>
        <button class="calc-display" id="main-display" disabled="true">0</div>
        <br>
        <button class="calc-button" id="c-button">C</button>
        <button class="calc-button" id="x-button">X</button>
        <button class="calc-button" id="slash-button">/</button>
        <button class="calc-button" id="clear-button">C</button>
        <br>
        <button class="calc-button" id="13-button">13</button>
        <button class="calc-button" id="17-button">17</button>
        <button class="calc-button" id="19-button">19</button>
        <button class="calc-button" id="carrot-button">^</button>
        <br>
        <button class="calc-button" id="5-button">5</button>
        <button class="calc-button" id="7-button">7</button>
        <button class="calc-button" id="11-button">11</button>
        <button class="calc-button" id="minus-button">-</button>
        <br>
        <button class="calc-button" id="1-button">1</button>
        <button class="calc-button" id="2-button">2</button>
        <button class="calc-button" id="3-button">3</button>
        <button class="calc-button" id="plus-button">=</button>
        <br>
        <button class="calc-button" id="plus-plus-button">+/+</button>
        <button class="calc-button" id="0-button">0</button>
        <button class="calc-button" id="dot-button">.</button>
        <button class="calc-button" id="equals-button">=</button>
    </body>
</html>
